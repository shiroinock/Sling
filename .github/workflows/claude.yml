# The owner's @claude in an issue, a PR comment or a review runs Claude Code.
# The job itself lives in shiroinock/workflows; change it there, not here.
name: Claude

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] the job runs only for the owner's @claude
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    uses: shiroinock/workflows/.github/workflows/claude.yml@main # zizmor: ignore[unpinned-uses] the owner's own shared jobs, followed at main on purpose
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
